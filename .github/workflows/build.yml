name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: expiry-reminder-linux
            suffix: linux
          - os: windows-latest
            artifact_name: expiry-reminder-windows
            suffix: windows
          - os: macos-latest
            artifact_name: expiry-reminder-macos
            suffix: macos

    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl xlrd pyinstaller Pillow

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Convert icon for macOS
        if: runner.os == 'macOS'
        run: |
          python3 -c "
          from PIL import Image
          img = Image.open('assets/icon.ico')
          img.save('assets/icon.icns', format='ICNS')
          print('ICNS icon created')
          "

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --name expiry-reminder --windowed --onefile \
            --icon=assets/icon.ico \
            --add-data "assets:assets" \
            --hidden-import modules \
            --hidden-import modules.config \
            --hidden-import modules.utils \
            --hidden-import modules.widgets \
            --hidden-import modules.history_panel \
            --hidden-import modules.analysis_panel \
            --hidden-import modules.file_ops \
            --hidden-import modules.notify_panel \
            --hidden-import modules.robot_sync \
            expiry_reminder.py
          mv dist/expiry-reminder dist/expiry-reminder-linux

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name expiry-reminder --windowed --onefile `
            --icon=assets/icon.ico `
            --add-data "assets;assets" `
            --hidden-import modules `
            --hidden-import modules.config `
            --hidden-import modules.utils `
            --hidden-import modules.widgets `
            --hidden-import modules.history_panel `
            --hidden-import modules.analysis_panel `
            --hidden-import modules.file_ops `
            --hidden-import modules.notify_panel `
            --hidden-import modules.robot_sync `
            expiry_reminder.py
          ren dist\expiry-reminder.exe expiry-reminder-windows.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --name expiry-reminder --windowed --onefile \
            --icon=assets/icon.icns \
            --add-data "assets:assets" \
            --hidden-import modules \
            --hidden-import modules.config \
            --hidden-import modules.utils \
            --hidden-import modules.widgets \
            --hidden-import modules.history_panel \
            --hidden-import modules.analysis_panel \
            --hidden-import modules.file_ops \
            --hidden-import modules.notify_panel \
            --hidden-import modules.robot_sync \
            expiry_reminder.py
          mv dist/expiry-reminder dist/expiry-reminder-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

      - name: Generate version
        id: version
        if: runner.os == 'Linux'
        run: echo "tag=v5.4-$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body: |
            ## 🔗 到期提醒工具 ${{ needs.build.outputs.version }}

            自动构建于 ${{ github.event.repository.updated_at }}

            ### 📥 下载
            | 平台 | 文件 |
            |------|------|
            | 🪟 Windows | `expiry-reminder-windows.exe` |
            | 🍎 macOS | `expiry-reminder-macos` |
            | 🐧 Linux | `expiry-reminder-linux` |

            ### ✨ 功能
            - 📊 Excel 到期分析（聚合/明细视图）
            - 🚚 送货记录管理
            - 📋 历史快照对比
            - 🤖 钉钉/企业微信机器人定时推送
            - 🔗 机器人同步面板（Webhook 配置 + 消息预览）

            ---
            *Built by GitHub Actions*
          files: |
            artifacts/expiry-reminder-linux/**
            artifacts/expiry-reminder-windows/**
            artifacts/expiry-reminder-macos/**
          draft: false
          prerelease: false
